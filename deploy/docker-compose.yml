# Mise en ligne d'ISD sur un serveur : site web + API + base + HTTPS + sauvegardes.
# Tout se pilote depuis ce dossier :  docker compose up -d   (voir README.md)
# Les secrets sont dans deploy/.env (créé par install.sh, jamais versionné).
name: isd

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: isd
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD manquant dans deploy/.env}
    volumes:
      - mongo-data:/data/db
    # Aucun port publié : la base n'est joignable que par l'API, à l'intérieur du serveur.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build: ..
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      TRUST_PROXY: "1"
      MONGO_URI: mongodb://isd:${MONGO_PASSWORD}@mongo:27017/isd?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY:?CHAT_ENCRYPTION_KEY manquant}
      ISD_MOBILE_MONEY_NUMBER: ${ISD_MOBILE_MONEY_NUMBER:?ISD_MOBILE_MONEY_NUMBER manquant}
      CORS_ORIGINS: https://${DOMAIN}${EXTRA_ORIGINS:-}
      PUBLIC_API_URL: https://${DOMAIN}
      WHATSAPP_ISD: ${WHATSAPP_ISD:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CINETPAY_APIKEY: ${CINETPAY_APIKEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant (email pour le certificat HTTPS)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

  # Sauvegarde quotidienne de la base dans deploy/backups (14 jours conservés).
  backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://isd:${MONGO_PASSWORD}@mongo:27017/isd?authSource=admin
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
